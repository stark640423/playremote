name: Release (Windows + macOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --name PlayRemote --windowed gui.py
          --collect-all bleak --collect-submodules winrt --collect-binaries winrt --collect-data winrt
          --collect-all pycaw --collect-all comtypes --collect-all sounddevice --collect-all numpy
          --add-data "config.example.toml;." --add-data "assets;assets"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.ver.outputs.version || '0.0.0' }}
          installer\playremote.iss

      - name: Zip portable build
        run: Compress-Archive -Path dist\PlayRemote\* -DestinationPath dist\PlayRemote-portable-${{ steps.ver.outputs.version || 'dev' }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PlayRemote-windows
          path: |
            dist/PlayRemote-Setup-*.exe
            dist/PlayRemote-portable-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PlayRemote-Setup-*.exe
            dist/PlayRemote-portable-*.zip
          generate_release_notes: true

  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_KEY_P8_B64: ${{ secrets.NOTARY_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import Developer ID certificate
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "SIGN_IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.+)".*/\1/')" >> "$GITHUB_ENV"
          rm /tmp/cert.p12

      - name: Prepare notarization key
        if: ${{ env.NOTARY_KEY_P8_B64 != '' }}
        env:
          NOTARY_KEY_P8_B64: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_P8=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_ID=${{ secrets.NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
          echo "NOTARY_ISSUER_ID=${{ secrets.NOTARY_ISSUER_ID }}" >> "$GITHUB_ENV"

      - name: Build app + DMG (sign + notarize when secrets are set)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: PYTHON=python installer/build_mac.sh "${{ steps.ver.outputs.version || '0.0.0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PlayRemote-macos
          path: dist/PlayRemote-*-macOS.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PlayRemote-*-macOS.dmg
          generate_release_notes: true
