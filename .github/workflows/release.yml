name: Windows installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --name PlayRemote --windowed gui.py
          --collect-all bleak --collect-submodules winrt --collect-binaries winrt --collect-data winrt
          --collect-all pycaw --collect-all comtypes --collect-all sounddevice --hidden-import numpy
          --add-data "config.example.toml;."

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.ver.outputs.version || '0.0.0' }}
          installer\playremote.iss

      - name: Zip portable build
        run: Compress-Archive -Path dist\PlayRemote\* -DestinationPath dist\PlayRemote-portable-${{ steps.ver.outputs.version || 'dev' }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PlayRemote-windows
          path: |
            dist/PlayRemote-Setup-*.exe
            dist/PlayRemote-portable-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PlayRemote-Setup-*.exe
            dist/PlayRemote-portable-*.zip
          generate_release_notes: true
